<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.h{font-size:24px;font-weight:bold}.t{font-size:14px}.box{fill:white;stroke:#718297;stroke-width:2}.client{fill:#f5e7f7;stroke:#8d4da0;stroke-width:2}.gateway{fill:#e8f2ff;stroke:#3b77b7;stroke-width:2}.backend{fill:#e6f6ef;stroke:#2d8c68;stroke-width:2}.camera{fill:#f9e5df;stroke:#ad5a41;stroke-width:2}.profile{fill:#fff4d8;stroke:#c38a17;stroke-width:2}.arrow{stroke:#53677d;stroke-width:2.5;fill:none;marker-end:url(#a)}.media{stroke:#9d3b6a;stroke-width:3;fill:none;marker-end:url(#m)}.event{stroke:#2f7f5f;stroke-width:2.5;stroke-dasharray:8 5;fill:none;marker-end:url(#e)}.opt{stroke:#7d8791;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#o)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><polygon points="0 0,8 3.5,0 7" fill="#53677d"/></marker><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><polygon points="0 0,8 3.5,0 7" fill="#9d3b6a"/></marker><marker id="e" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><polygon points="0 0,8 3.5,0 7" fill="#2f7f5f"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><polygon points="0 0,8 3.5,0 7" fill="#7d8791"/></marker></defs><rect width="1400" height="900" fill="white"/><text x="700" y="42" class="h" text-anchor="middle">Live View — Platform v2 Relationship</text><rect x="480" y="75" width="440" height="85" rx="12" class="profile"/><text x="700" y="108" class="h" text-anchor="middle">Product Profile</text><text x="700" y="136" class="t" text-anchor="middle">placement • capability • contract version • provider • security • offline policy • budgets</text><rect x="45" y="230" width="280" height="210" rx="14" class="client"/><text x="185" y="265" class="h" text-anchor="middle">Client</text><text x="185" y="300" class="t" text-anchor="middle">Live View</text><text x="185" y="328" class="t" text-anchor="middle">presentation / user interaction</text><rect x="385" y="230" width="280" height="210" rx="14" class="gateway"/><text x="525" y="265" class="h" text-anchor="middle">Optional Gateway</text><text x="525" y="302" class="t" text-anchor="middle">relay / local aggregation / cache</text><rect x="735" y="230" width="280" height="210" rx="14" class="backend"/><text x="875" y="265" class="h" text-anchor="middle">Optional Backend</text><text x="875" y="302" class="t" text-anchor="middle">enterprise services / cloud repository</text><rect x="1075" y="230" width="280" height="210" rx="14" class="camera"/><text x="1215" y="265" class="h" text-anchor="middle">Camera Device</text><text x="1215" y="300" class="t" text-anchor="middle">product service + local enforcement</text><text x="1215" y="328" class="t" text-anchor="middle">standalone behavior retained</text><path d="M325 300 L385 300" class="arrow"/><text x="355" y="288" class="t" text-anchor="middle">control</text><path d="M665 300 L735 300" class="event"/><text x="700" y="288" class="t" text-anchor="middle">events/state</text><path d="M1015 300 L1075 300" class="arrow"/><text x="1045" y="288" class="t" text-anchor="middle">management</text><path d="M185 440 C185 560,1090 560,1215 440" class="media"/><text x="700" y="548" class="t" text-anchor="middle">direct media/data path when profile permits</text><path d="M525 440 C525 505,1120 505,1215 440" class="media"/><text x="845" y="493" class="t" text-anchor="middle">optional relay</text><path d="M700 160 C700 200,185 195,185 230" class="opt"/><path d="M700 160 C700 200,525 195,525 230" class="opt"/><path d="M700 160 C700 200,875 195,875 230" class="opt"/><path d="M700 160 C700 200,1215 195,1215 230" class="opt"/><rect x="300" y="650" width="800" height="135" rx="14" class="box"/><text x="700" y="683" class="h" text-anchor="middle">Product-owned contract</text><text x="700" y="715" class="t" text-anchor="middle">LiveViewSession contract: session ownership, capability negotiation, authorization/revocation, reconnect state, and explicit control/media channels.</text><text x="700" y="748" class="t" text-anchor="middle">Provider/OS/hardware details stay behind qualified adapters.</text><text x="700" y="815" class="t" text-anchor="middle">Solid = control/service • dashed green = event/state • magenta = media/high-bandwidth • grey dashed = Product Profile selection</text></svg>