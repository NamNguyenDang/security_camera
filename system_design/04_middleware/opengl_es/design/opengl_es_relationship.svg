<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780"><defs><style>text{font-family:Arial;fill:#172033}.h{font-size:22px;font-weight:bold}.t{font-size:14px}.p{fill:#fff4d8;stroke:#c38a17;stroke-width:2}.prod{fill:#f5e7f7;stroke:#8d4da0;stroke-width:2}.ct{fill:white;stroke:#718297;stroke-width:2}.ad{fill:#eee9fb;stroke:#6a54a5;stroke-width:2}.os{fill:#e7edf2;stroke:#526a7e;stroke-width:2}.a{stroke:#53677d;stroke-width:2.5;fill:none;marker-end:url(#a)}.o{stroke:#7d8791;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#o)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><polygon points="0 0,8 3.5,0 7" fill="#53677d"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><polygon points="0 0,8 3.5,0 7" fill="#7d8791"/></marker></defs><rect width="1400" height="780" fill="white"/><text x="700" y="40" class="h" text-anchor="middle">OpenGL ES Adapter — optional provider relationship</text><rect x="500" y="70" width="400" height="80" rx="12" class="p"/><text x="700" y="104" class="h" text-anchor="middle">Product Profile / Security Profile</text><rect x="70" y="245" width="300" height="160" rx="12" class="prod"/><text x="220" y="282" class="h" text-anchor="middle">Product / Presentation Logic</text><rect x="550" y="225" width="300" height="200" rx="12" class="ct"/><text x="700" y="265" class="h" text-anchor="middle">Portable Contract</text><text x="700" y="305" class="t" text-anchor="middle">RenderingCapability contract independent of OpenGL ES types and separate for client display versus optional camera-local display.</text><rect x="1030" y="245" width="300" height="160" rx="12" class="ad"/><text x="1180" y="282" class="h" text-anchor="middle">Qualified Provider</text><path d="M370 325 L550 325" class="a"/><path d="M850 325 L1030 325" class="a"/><path d="M700 150 L700 225" class="o"/><rect x="480" y="535" width="440" height="100" rx="12" class="os"/><text x="700" y="572