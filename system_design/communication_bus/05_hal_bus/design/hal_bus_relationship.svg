<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800"><defs><style>text{font-family:Arial;fill:#172033}.h{font-size:22px;font-weight:bold}.t{font-size:14px}.p{fill:#fff4d8;stroke:#c38a17;stroke-width:2}.up{fill:white;stroke:#718297;stroke-width:2}.os{fill:#e7edf2;stroke:#526a7e;stroke-width:2}.hw{fill:#ececec;stroke:#59636a;stroke-width:2}.a{stroke:#53677d;stroke-width:2.5;fill:none;marker-end:url(#a)}.o{stroke:#7d8791;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#o)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><polygon points="0 0,8 3.5,0 7" fill="#53677d"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><polygon points="0 0,8 3.5,0 7" fill="#7d8791"/></marker></defs><rect width="1400" height="800" fill="white"/><text x="700" y="40" class="h" text-anchor="middle">Platform HAL / OS Integration Boundary — v2 implementation boundary</text><rect x="500" y="70" width="400" height="80" rx="12" class="p"/><text x="700" y="105" class="h" text-anchor="middle">Product Profile</text><rect x="430" y="220" width="540" height="120" rx="12" class="up"/><text x="700" y="258" class="h" text-anchor="middle">Portable upper contract / guarantee</text><text x="700" y="292" class="t" text-anchor="middle">PlatformIntegration boundary defining capability/version compatibility, ownership, error translation, reset/power behavior, and driver-adapter responsibility.</text><rect x="430" y="430" width="540" height="120" rx="12" class="os"/><text x="700" y="468" class="h" text-anchor="middle">OS / driver / integration boundary</text><rect x="430" y="635" width="540" height="90" rx="12" class="hw"/><text x="700" y="690" class="h" text-anchor="middle">Physical board / interconnect / device</text><path d="M700 150 L700 220" class="o"/><path d="M700 340 L700 430" class="a"/><path d="M700 550 L700 635" class="a"/></svg>