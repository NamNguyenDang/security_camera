<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820"><defs><style>text{font-family:Arial;fill:#172033}.h{font-size:22px;font-weight:bold}.t{font-size:14px}.p{fill:#fff4d8;stroke:#c38a17;stroke-width:2}.left{fill:#f9e5df;stroke:#ad5a41;stroke-width:2}.ct{fill:white;stroke:#718297;stroke-width:2}.right{fill:#eee9fb;stroke:#6a54a5;stroke-width:2}.a{stroke:#53677d;stroke-width:2.5;fill:none;marker-end:url(#a)}.e{stroke:#2f7f5f;stroke-width:2.5;stroke-dasharray:8 5;fill:none;marker-end:url(#e)}.m{stroke:#9d3b6a;stroke-width:3;fill:none;marker-end:url(#m)}.o{stroke:#7d8791;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#o)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><polygon points="0 0,8 3.5,0 7" fill="#53677d"/></marker><marker id="e" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><polygon points="0 0,8 3.5,0 7" fill="#2f7f5f"/></marker><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><polygon points="0 0,8 3.5,0 7" fill="#9d3b6a"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><polygon points="0 0,8 3.5,0 7" fill="#7d8791"/></marker></defs><rect width="1400" height="820" fill="white"/><text x="700" y="40" class="h" text-anchor="middle">Service Contract Boundary — v2 communication boundary</text><rect x="500" y="70" width="400" height="80" rx="12" class="p"/><text x="700" y="105" class="h" text-anchor="middle">Product Profile</text><rect x="80" y="245" width="300" height="170" rx="12" class="left"/><text x="230" y="280" class="h" text-anchor="middle">Consumer / Caller</text><rect x="550" y="225" width="300" height="210" rx="12" class="ct"/><text x="700" y="265" class="h" text-anchor="middle">Portable Contract</text><text x="700" y="305" class="t" text-anchor="middle">ServiceContract boundary with call style, discovery/binding, ownership, compatibility, authorization context, timeout, unavailable-service behavior, and selected transport.</text><rect x="1020" y="245" width="300" height="170" rx="12" class="right"/><text x="1170" y="280" class="h" text-anchor="middle">Service / Adapter / Repository</text><path d="M380 290 L550 290" class="a"/><path d="M380 330 L550 330" class="e"/><path d="M850 370 L1020 370" class="m"/><path d="M850 290 L1020 290" class="a"/><path d="M700 150 L700 225" class="o"/><text x="700" y="515" class="t" text-anchor="middle">Solid = command/service • green dashed = events/state • magenta = media/high-bandwidth (only where applicable)</text><rect x="340" y="575" width="720" height="90" rx="12" class="ct"/><text x="700" y="612" class="h" text-anchor="middle">Transport/process placement is selected separately</text></svg>