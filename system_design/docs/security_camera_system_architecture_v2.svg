<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2000" viewBox="0 0 1600 2000">
<defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#172033}
.title{font-size:34px;font-weight:bold}.subtitle{font-size:17px;fill:#53657a}
.h{font-size:22px;font-weight:bold}.t{font-size:15px}.small{font-size:13px}
.box{fill:#fff;stroke:#718297;stroke-width:1.5}.profile{fill:#fff4d8;stroke:#c38a17;stroke-width:2.5}
.client{fill:#f5e7f7;stroke:#8d4da0;stroke-width:2.5}.gateway{fill:#e8f2ff;stroke:#3b77b7;stroke-width:2.5}
.backend{fill:#e6f6ef;stroke:#2d8c68;stroke-width:2.5}.camera{fill:#f9e5df;stroke:#ad5a41;stroke-width:2.8}
.adapter{fill:#eee9fb;stroke:#6a54a5;stroke-width:2.5}.os{fill:#e7edf2;stroke:#526a7e;stroke-width:2.5}
.hw{fill:#ececec;stroke:#59636a;stroke-width:2.5}.sec{fill:#eaf7ff;stroke:#278bc4;stroke-width:2.2}
.persist{fill:#fff7e6;stroke:#bd862f;stroke-width:2.2}.arrow{stroke:#53677d;stroke-width:2.5;fill:none;marker-end:url(#a)}
.media{stroke:#9d3b6a;stroke-width:3;fill:none;marker-end:url(#m)}
.event{stroke:#2f7f5f;stroke-width:2.5;stroke-dasharray:8 6;fill:none;marker-end:url(#e)}
.optional{stroke:#7d8791;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#o)}
</style>
<marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><polygon points="0 0,8 3.5,0 7" fill="#53677d"/></marker>
<marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><polygon points="0 0,8 3.5,0 7" fill="#9d3b6a"/></marker>
<marker id="e" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><polygon points="0 0,8 3.5,0 7" fill="#2f7f5f"/></marker>
<marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><polygon points="0 0,8 3.5,0 7" fill="#7d8791"/></marker>
</defs>
<rect width="1600" height="2000" fill="white"/>
<text x="800" y="48" class="title" text-anchor="middle">Security Camera Product Platform — Architecture v2</text>
<text x="800" y="78" class="subtitle" text-anchor="middle">Deployment-first • contract-first • standalone-capable • supplier-replaceable • product-profile driven</text>

<rect x="370" y="105" width="860" height="170" rx="16" class="profile"/>
<text x="800" y="140" class="h" text-anchor="middle">PRODUCT PROFILE</text>
<text x="800" y="168" class="t" text-anchor="middle">Capabilities • placement • optional deployments • adapter/provider selection • compatible contract versions</text>
<text x="800" y="193" class="t" text-anchor="middle">Operating-system target • storage placement • security profile • offline/standalone policy • performance budgets</text>
<text x="800" y="225" class="small" text-anchor="middle">Profiles may select headless/display, audio/no-audio, NPU/no-NPU, standalone, gateway-managed, or cloud-connected products.</text>

<rect x="55" y="330" width="430" height="340" rx="18" class="client"/>
<text x="270" y="365" class="h" text-anchor="middle">CLIENT DEPLOYMENT</text>
<text x="270" y="392" class="t" text-anchor="middle">Android • iOS • Web • other supported clients</text>
<rect x="90" y="425" width="360" height="90" rx="10" class="box"/><text x="270" y="454" class="t" text-anchor="middle">Presentation</text><text x="270" y="480" class="small" text-anchor="middle">Live View • Playback • Alarm • Settings • Event Search • Administration</text>
<rect x="90" y="535" width="360" height="95" rx="10" class="box"/><text x="270" y="565" class="t" text-anchor="middle">Client Platform Adapters</text><text x="270" y="590" class="small" text-anchor="middle">Lifecycle • Media Surface • Notifications • Credential Storage</text>
<text x="270" y="650" class="small" text-anchor="middle">Client hardware and OS are separate from camera hardware and OS.</text>

<rect x="585" y="330" width="430" height="340" rx="18" class="gateway"/>
<text x="800" y="365" class="h" text-anchor="middle">OPTIONAL SITE GATEWAY</text>
<rect x="620" y="410" width="360" height="205" rx="10" class="box"/>
<text x="800" y="440" class="t" text-anchor="middle">Local aggregation</text>
<text x="800" y="466" class="t" text-anchor="middle">Site-level event routing</text>
<text x="800" y="492" class="t" text-anchor="middle">Recording cache / relay</text>
<text x="800" y="518" class="t" text-anchor="middle">Local device management</text>
<text x="800" y="544" class="t" text-anchor="middle">Offline backend proxy</text>
<text x="800" y="570" class="t" text-anchor="middle">Site authorization / policy cache</text>
<text x="800" y="645" class="small" text-anchor="middle">Separate deployment from cloud/backend.</text>

<rect x="1115" y="330" width="430" height="340" rx="18" class="backend"/>
<text x="1330" y="365" class="h" text-anchor="middle">OPTIONAL BACKEND / CLOUD</text>
<rect x="1150" y="410" width="360" height="205" rx="10" class="box"/>
<text x="1330" y="440" class="t" text-anchor="middle">Enterprise identity / policy source</text>
<text x="1330" y="466" class="t" text-anchor="middle">Fleet management</text>
<text x="1330" y="492" class="t" text-anchor="middle">Cloud recording repository</text>
<text x="1330" y="518" class="t" text-anchor="middle">Metadata / event repository</text>
<text x="1330" y="544" class="t" text-anchor="middle">Notification routing</text>
<text x="1330" y="570" class="t" text-anchor="middle">Remote management / analytics / search</text>
<text x="1330" y="645" class="small" text-anchor="middle">Not required by the standalone profile.</text>

<rect x="300" y="760" width="1000" height="445" rx="22" class="camera"/>
<text x="800" y="800" class="h" text-anchor="middle">CAMERA DEVICE</text>
<text x="800" y="828" class="small" text-anchor="middle">Mandatory standalone behavior remains defined even when Gateway and Backend are absent.</text>

<rect x="345" y="860" width="440" height="270" rx="12" class="box"/>
<text x="565" y="892" class="t" text-anchor="middle">Product Services</text>
<text x="565" y="925" class="small" text-anchor="middle">Camera Service • Media Service • Recording Orchestration</text>
<text x="565" y="954" class="small" text-anchor="middle">AI Inference Service • Network Service • Device Management</text>
<text x="565" y="983" class="small" text-anchor="middle">Local event handling • local configuration • recovery state</text>
<text x="565" y="1012" class="small" text-anchor="middle">Control path, event path, and media path are designed separately.</text>

<rect x="815" y="860" width="440" height="270" rx="12" class="sec"/>
<text x="1035" y="892" class="t" text-anchor="middle">Device Security</text>
<text x="1035" y="925" class="small" text-anchor="middle">Device authentication • local authorization enforcement</text>
<text x="1035" y="954" class="small" text-anchor="middle">Protected key access • recording/data protection</text>
<text x="1035" y="983" class="small" text-anchor="middle">Secure transport • audit/security events</text>
<text x="1035" y="1012" class="small" text-anchor="middle">Secure boot / update trust according to security profile</text>
<text x="1035" y="1041" class="small" text-anchor="middle">Safe offline behavior is explicit.</text>

<rect x="345" y="1070" width="910" height="90" rx="10" class="persist"/>
<text x="800" y="1100" class="t" text-anchor="middle">Standalone local state ownership</text>
<text x="800" y="1127" class="small" text-anchor="middle">Local identity/permissions • recording metadata • events • audit • configuration • recovery</text>

<rect x="300" y="1285" width="1000" height="310" rx="20" class="adapter"/>
<text x="800" y="1325" class="h" text-anchor="middle">PLATFORM ADAPTERS / PROVIDERS</text>
<rect x="340" y="1365" width="280" height="155" rx="10" class="box"/>
<text x="480" y="1395" class="t" text-anchor="middle">Media / Device</text>
<text x="480" y="1423" class="small" text-anchor="middle">Capture Adapter</text>
<text x="480" y="1448" class="small" text-anchor="middle">Codec Adapter</text>
<text x="480" y="1473" class="small" text-anchor="middle">Inference Adapter</text>
<text x="480" y="1498" class="small" text-anchor="middle">Network Adapter</text>

<rect x="660" y="1365" width="280" height="155" rx="10" class="persist"/>
<text x="800" y="1395" class="t" text-anchor="middle">Persistence</text>
<text x="800" y="1423" class="small" text-anchor="middle">Recording Repository Adapter</text>
<text x="800" y="1448" class="small" text-anchor="middle">Metadata Repository Adapter</text>
<text x="800" y="1473" class="small" text-anchor="middle">Platform Storage Adapter</text>

<rect x="980" y="1365" width="280" height="155" rx="10" class="sec"/>
<text x="1120" y="1395" class="t" text-anchor="middle">Security / Optional I/O</text>
<text x="1120" y="1423" class="small" text-anchor="middle">Secure Transport Provider</text>
<text x="1120" y="1448" class="small" text-anchor="middle">Secure Hardware Provider</text>
<text x="1120" y="1473" class="small" text-anchor="middle">Optional Display Adapter</text>
<text x="1120" y="1498" class="small" text-anchor="middle">Optional Audio Adapter</text>

<rect x="300" y="1660" width="1000" height="150" rx="18" class="os"/>
<text x="800" y="1700" class="h" text-anchor="middle">OPERATING-SYSTEM / VENDOR INTEGRATION</text>
<text x="800" y="1732" class="t" text-anchor="middle">Linux • Android-derived platform • RTOS • vendor OS • supplier SDK/runtime • other qualified platform</text>
<text x="800" y="1763" class="small" text-anchor="middle">Drivers • board support • supplier SDKs • hardware-specific runtime</text>

<rect x="300" y="1860" width="1000" height="105" rx="18" class="hw"/>
<text x="800" y="1896" class="h" text-anchor="middle">HARDWARE PLATFORM / QUALIFIED SUPPLIERS</text>
<text x="800" y="1928" class="small" text-anchor="middle">SoC • Camera Sensor • NPU • Storage • Ethernet/Wi-Fi • Audio • Optional Display • Security Provider • Peripherals</text>

<!-- deployment communication -->
<path d="M485 500 C540 500,540 500,585 500" class="arrow"/><text x="535" y="485" class="small" text-anchor="middle">control/events</text>
<path d="M1015 500 C1060 500,1060 500,1115 500" class="arrow"/><text x="1065" y="485" class="small" text-anchor="middle">gateway↔backend</text>
<path d="M270 670 C270 725,390 725,430 760" class="media"/><text x="300" y="718" class="small">direct media/control when profile permits</text>
<path d="M800 670 L800 760" class="arrow"/><text x="820" y="720" class="small">camera↔gateway</text>
<path d="M1330 670 C1330 730,1180 730,1160 760" class="arrow"/><text x="1240" y="718" class="small">camera↔backend</text>

<!-- camera/adapters/os/hw -->
<path d="M800 1205 L800 1285" class="arrow"/>
<path d="M800 1595 L800 1660" class="arrow"/>
<path d="M800 1810 L800 1860" class="arrow"/>

<!-- profile influence -->
<path d="M600 275 C470 300,300 300,270 330" class="optional"/>
<path d="M800 275 L800 330" class="optional"/>
<path d="M1000 275 C1130 300,1300 300,1330 330" class="optional"/>
<path d="M800 275 C800 610,780 640,800 760" class="optional"/>

<!-- legend -->
<text x="70" y="1982" class="small">Legend:</text>
<line x1="130" y1="1977" x2="190" y2="1977" class="arrow"/><text x="245" y="1982" class="small">control/service</text>
<line x1="355" y1="1977" x2="415" y2="1977" class="event"/><text x="475" y="1982" class="small">events/state</text>
<line x1="570" y1="1977" x2="630" y2="1977" class="media"/><text x="690" y="1982" class="small">media/high-bandwidth</text>
<line x1="825" y1="1977" x2="885" y2="1977" class="optional"/><text x="970" y="1982" class="small">profile-selected / optional</text>
</svg>