<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800"><defs><style>text{font-family:Arial;fill:#172033}.h{font-size:22px;font-weight:bold}.t{font-size:14px}.p{fill:#fff4d8;stroke:#c38a17;stroke-width:2}.prod{fill:white;stroke:#718297;stroke-width:2}.sec{fill:#eaf7ff;stroke:#278bc4;stroke-width:2}.iso{fill:#eee9fb;stroke:#6a54a5;stroke-width:2}.hw{fill:#ececec;stroke:#59636a;stroke-width:2}.a{stroke:#53677d;stroke-width:2.5;fill:none;marker-end:url(#a)}.o{stroke:#7d8791;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#o)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><polygon points="0 0,8 3.5,0 7" fill="#53677d"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><polygon points="0 0,8 3.5,0 7" fill="#7d8791"/></marker></defs><rect width="1400" height="800" fill="white"/><text x="700" y="40" class="h" text-anchor="middle">Kernel / OS Hardening — security isolation relationship</text><rect x="500" y="70" width="400" height="80" rx="12" class="p"/><text x="700" y="105" class="h" text-anchor="middle">Security Profile</text><rect x="430" y="210" width="540" height="110" rx="12" class="prod"/><text x="700" y="250" class="h" text-anchor="middle">Product security requirement</text><text x="700" y="282" class="t" text-anchor="middle">OSHardeningProfile contract defining required control categories, privilege/device isolation, exploit mitigations, configuration evidence, and unsupported-control behavior.</text><rect x="430" y="405" width="540" height="115" rx="12" class="sec"/><text x="700" y="445" class="h" text-anchor="middle">Portable security contract</text><rect x="430" y="600" width="540" height="105" rx="12" class="iso"/><text x="700" y="638" class="h" text-anchor="middle">Actual isolation / OS / TEE / provider mechanism</text><text x="700" y="670" class="t" text-anchor="middle">must be named and qualified</text><path d="M700 150 L700 210" class="o"/><path d="M700 320 L700 405" class="a"/><path d="M700 520 L700 600" class="a"/></svg>