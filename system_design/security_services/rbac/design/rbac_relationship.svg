0 230" class="o"/><path d="M700 150 C700 205,890 190,890 230" class="o"/><path d="M700 150 C700 205,1225 190,1225 230" class="o"/><rect x="280" y="515" width="840" height="150" rx="12" class="sec"/><text x="700" y="552" class="h" text-anchor="middle">Portable security contract</text><text x="700" y="590" class="t" text-anchor="middle">AuthorizationDecision contract including principal, role/permission, customer/site/area/device/recording scope, inheritance, explicit deny, policy version, and offline state.</text><text x="700" y="625" class="t" text-anchor="middle">Provider mechanisms may change; protection and enforcement obligations remain.</text></svg>